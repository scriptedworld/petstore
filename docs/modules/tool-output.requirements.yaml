schema_version: 1
module: petstore.tool_output
id_prefix: PS-OUT
next_id: 9

requirements:
  - id: PS-OUT-001
    title: Versioned result envelope
    status: retired
    introduced: 0.1.0
    retired: "2026-08-25"
    retirement_reason: >-
      Replaced by the clarified three-field result contract.
    superseded_by:
      - PS-OUT-004
      - PS-OUT-005
      - PS-OUT-006
    statement: >-
      ToolResult shall represent a tool name, terminal status, summary, named
      metrics, actionable findings, and normalized evidence beneath schema
      version 1.
    functionality:
      - tool_output.document
    required_test_types:
      - positive

  - id: PS-OUT-002
    title: Deterministic canonical YAML
    status: retired
    introduced: 0.1.0
    retired: "2026-08-25"
    retirement_reason: >-
      Replaced after simplifying the result envelope.
    superseded_by:
      - PS-OUT-007
    statement: >-
      render_yaml shall serialize a ToolResult as deterministic block-style
      YAML while preserving the defined field order and optional finding
      locations.
    functionality:
      - tool_output.yaml
    required_test_types:
      - invariant

  - id: PS-OUT-003
    title: Process exit semantics
    status: retired
    introduced: 0.1.0
    retired: "2026-08-25"
    retirement_reason: >-
      Replaced three-state status codes with Boolean success semantics.
    superseded_by:
      - PS-OUT-008
    statement: >-
      exit_code shall return zero for passed results, one for failed results,
      and two for execution-error results.
    functionality:
      - tool_output.exit_code
    required_test_types:
      - edge

  - id: PS-OUT-004
    title: Required success result
    status: active
    introduced: 0.1.0
    statement: >-
      Every result envelope shall contain exactly one required success field
      whose value is Boolean.
    functionality:
      - tool_output.success
    required_test_types:
      - positive

  - id: PS-OUT-005
    title: Conditional failure reasons
    status: active
    introduced: 0.1.0
    statement: >-
      A failed envelope shall contain a non-empty reasons sequence whose entries
      each contain a non-empty message and may contain tool-specific fields. A
      successful envelope shall not contain reasons.
    functionality:
      - tool_output.reasons
    required_test_types:
      - positive
      - negative

  - id: PS-OUT-006
    title: Outcome-independent metadata
    status: active
    introduced: 0.1.0
    statement: >-
      An envelope may contain a metadata mapping regardless of its success
      value and shall omit metadata when none is supplied.
    functionality:
      - tool_output.metadata
    required_test_types:
      - invariant

  - id: PS-OUT-007
    title: Deterministic canonical YAML
    status: active
    introduced: 0.1.0
    statement: >-
      render_yaml shall serialize a validated result envelope as deterministic
      block-style YAML while preserving the defined top-level field order.
    functionality:
      - tool_output.yaml
    required_test_types:
      - invariant

  - id: PS-OUT-008
    title: Boolean process exit semantics
    status: active
    introduced: 0.1.0
    statement: >-
      exit_code shall return zero when success is true and one when success is
      false.
    functionality:
      - tool_output.exit_code
    required_test_types:
      - edge
