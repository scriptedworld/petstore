schema_version: 1
module: petstore.validation
id_prefix: PS-VALID
next_id: 6

requirements:
  - id: PS-VALID-001
    title: Validation on assignment
    status: active
    introduced: 0.1.0
    statement: >-
      A validated attribute shall apply its rules whenever a value is assigned,
      including the assignment performed by a dataclass constructor, and shall
      store the value unchanged when every rule accepts it.
    functionality:
      - validated.assignment
    required_test_types:
      - positive
      - invariant

  - id: PS-VALID-002
    title: Rule sequencing
    status: active
    introduced: 0.1.0
    statement: >-
      Rules shall be applied in declaration order and the first rule to reject a
      value shall determine the reported failure; later rules shall not run. A
      validated attribute declared without rules shall accept any value.
    functionality:
      - validated.rules
    required_test_types:
      - positive
      - negative

  - id: PS-VALID-003
    title: Failure labelling
    status: active
    introduced: 0.1.0
    statement: >-
      A rejected value shall raise ValidationError whose message is the rule's
      own message prefixed with the attribute's label. The label shall default
      to the attribute name and shall be overridable at declaration.
    functionality:
      - validated.label
    required_test_types:
      - negative
      - edge

  - id: PS-VALID-004
    title: Frozen owners
    status: active
    introduced: 0.1.0
    statement: >-
      A validated attribute shall store values on instances of frozen
      dataclasses, which reject ordinary attribute assignment.
    functionality:
      - validated.frozen
    required_test_types:
      - invariant

  - id: PS-VALID-005
    title: Class access
    status: active
    introduced: 0.1.0
    statement: >-
      Reading a validated attribute from the owning class rather than an
      instance shall return the descriptor itself, leaving it available for
      inspection.
    functionality:
      - validated.class_access
    required_test_types:
      - edge
