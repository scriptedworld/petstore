schema_version: 1
module: petstore.traceability
id_prefix: PS-TRACE
next_id: 12

requirements:
  - id: PS-TRACE-001
    title: Deterministic project discovery
    status: active
    introduced: 0.1.0
    statement: >-
      The project checker shall discover canonical requirement registries and
      Python test modules recursively beneath the supplied project root without
      executing test code.
    functionality:
      - traceability.project
    required_test_types:
      - positive

  - id: PS-TRACE-002
    title: Direct marker extraction
    status: active
    introduced: 0.1.0
    statement: >-
      The test parser shall extract requirement IDs, one or more functionality
      names, test classification, node identity, and source location from each
      directly marked collectable test definition.
    functionality:
      - traceability.test_parser
    required_test_types:
      - positive

  - id: PS-TRACE-003
    title: Registry structural validation
    status: active
    introduced: 0.1.0
    statement: >-
      The registry parser shall reject malformed registries, invalid statuses,
      unsupported test classifications, duplicate IDs, invalid ID formats, and
      a next_id that is not one greater than the greatest allocated ID.
    functionality:
      - traceability.registry_parser
    required_test_types:
      - negative

  - id: PS-TRACE-004
    title: Active known references
    status: active
    introduced: 0.1.0
    statement: >-
      Traceability analysis shall reject test evidence that refers to an
      unknown, draft, or retired requirement ID and shall reject IDs declared
      by multiple registries.
    functionality:
      - traceability.references
    required_test_types:
      - negative

  - id: PS-TRACE-005
    title: Complete active requirement coverage
    status: active
    introduced: 0.1.0
    statement: >-
      Traceability analysis shall fail when any active requirement has no test
      evidence and shall ignore draft and retired requirements when calculating
      required coverage.
    functionality:
      - traceability.requirement_coverage
    required_test_types:
      - negative

  - id: PS-TRACE-006
    title: Required test-classification coverage
    status: active
    introduced: 0.1.0
    statement: >-
      Traceability analysis shall fail when the evidence for an active
      requirement omits any test classification listed by that requirement.
    functionality:
      - traceability.test_type_coverage
    required_test_types:
      - negative

  - id: PS-TRACE-007
    title: Declared functionality coverage
    status: active
    introduced: 0.1.0
    statement: >-
      Traceability analysis shall reject marker functionality that belongs to
      none of its referenced requirements and shall require evidence for every
      functionality name declared by each active requirement.
    functionality:
      - traceability.functionality_coverage
    required_test_types:
      - negative

  - id: PS-TRACE-008
    title: Complete normalized evidence
    status: active
    introduced: 0.1.0
    statement: >-
      The tool result shall contain deterministic normalized records for every
      parsed requirement and directly marked test so later semantic evaluators
      can consume the evidence without rediscovering project files.
    functionality:
      - traceability.evidence
    required_test_types:
      - positive

  - id: PS-TRACE-009
    title: Malformed input findings
    status: active
    introduced: 0.1.0
    statement: >-
      Invalid YAML, invalid Python syntax, malformed marker values, and project
      filesystem failures shall produce stable actionable reason codes rather
      than uncaught exceptions.
    functionality:
      - traceability.input_findings
    required_test_types:
      - negative

  - id: PS-TRACE-010
    title: Marker required on every test
    status: active
    introduced: 0.1.0
    statement: >-
      Every directly collectable test definition shall declare exactly one
      direct pytest.mark.requirement marker.
    functionality:
      - traceability.marker_presence
    required_test_types:
      - negative

  - id: PS-TRACE-011
    title: Command result emission
    status: active
    introduced: 0.1.0
    statement: >-
      The composed command shall check the current project, emit one canonical
      YAML result through its output boundary, and return the result's defined
      process exit code.
    functionality:
      - traceability.command
    required_test_types:
      - positive
