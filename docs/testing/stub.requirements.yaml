schema_version: 1
module: petstore.stubs.generate
id_prefix: PS-TEST
next_id: 14

requirements:
  - id: PS-TEST-001
    title: Configurable return and call history
    status: retired
    introduced: 0.1.0
    retired: 2026-08-25
    superseded_by:
      - PS-TEST-006
      - PS-TEST-009
    retirement_reason: >-
      Replaced the object-based Stub API with the functional generate API.
    statement: >-
      Stub shall accept arbitrary positional and keyword arguments, return its
      configured value, and retain immutable call metadata in invocation order
      for any number of calls.
    functionality:
      - Stub.return_behavior
    required_test_types:
      - positive

  - id: PS-TEST-002
    title: Configurable exception behavior
    status: retired
    introduced: 0.1.0
    retired: 2026-08-25
    superseded_by:
      - PS-TEST-007
      - PS-TEST-009
    retirement_reason: >-
      Replaced the object-based Stub API with the functional generate API.
    statement: >-
      Stub shall raise a configured BaseException instance or zero-argument
      BaseException type after recording the invocation that raised it.
    functionality:
      - Stub.exception_behavior
    required_test_types:
      - negative

  - id: PS-TEST-003
    title: Reset and reconfiguration
    status: retired
    introduced: 0.1.0
    retired: 2026-08-25
    superseded_by:
      - PS-TEST-009
    retirement_reason: >-
      Reconfiguration was removed with the mutable Stub object; generated
      functions retain only the history-reset behavior.
    statement: >-
      Stub shall allow return and exception behavior to be reconfigured and
      shall clear its complete call history on reset without changing behavior
      until explicitly reconfigured.
    functionality:
      - Stub.reconfiguration
    required_test_types:
      - invariant

  - id: PS-TEST-004
    title: Explicit signature factory
    status: retired
    introduced: 0.1.0
    retired: 2026-08-25
    superseded_by:
      - PS-TEST-010
    retirement_reason: >-
      Replaced Stub.from_parameters with generate(parameters=...).
    statement: >-
      Stub.from_parameters shall create a stub from an ordered list of
      positional-or-keyword parameter names, enforce the resulting signature,
      and record the parameter-bound form of every valid invocation.
    functionality:
      - Stub.explicit_signature
    required_test_types:
      - positive

  - id: PS-TEST-005
    title: Callable signature decorator
    status: retired
    introduced: 0.1.0
    retired: 2026-08-25
    superseded_by:
      - PS-TEST-010
    retirement_reason: >-
      Replaced the object-based decorator with generate(signature_from=...).
    statement: >-
      The stubbed decorator shall inspect the decorated callable, return a stub
      that enforces its complete signature, and record the parameter-bound form
      of every valid invocation.
    functionality:
      - stubbed.callable_signature
    required_test_types:
      - positive

  - id: PS-TEST-006
    title: Generated return behavior
    status: retired
    introduced: 0.1.0
    retired: "2026-09-28"
    superseded_by:
      - PS-TEST-013
    retirement_reason: >-
      generate moved into petstore.stubs and now builds a Stub, so it returns
      a typed Stub rather than a plain function object.
    statement: >-
      generate(returns=value) shall return an ordinary function object that
      accepts arbitrary positional and keyword arguments and returns the
      configured value.
    functionality:
      - generate.return_behavior
    required_test_types:
      - positive

  - id: PS-TEST-007
    title: Generated exception behavior
    status: active
    introduced: 0.1.0
    statement: >-
      generate(raises=exception) shall return a function that raises the
      configured BaseException instance or zero-argument BaseException type.
    functionality:
      - generate.raise_behavior
    required_test_types:
      - negative

  - id: PS-TEST-008
    title: Generated yield behavior
    status: active
    introduced: 0.1.0
    statement: >-
      generate(yields=values) shall snapshot the values and return a function
      that creates a fresh iterator over that snapshot for every invocation.
    functionality:
      - generate.yield_behavior
    required_test_types:
      - positive

  - id: PS-TEST-009
    title: Immutable call history
    status: retired
    introduced: 0.1.0
    retired: "2026-08-25"
    superseded_by:
      - PS-TEST-012
    retirement_reason: >-
      Generated functions are disposable; creating another function replaces
      mutable history-reset behavior.
    statement: >-
      Every generated function shall record immutable invocation metadata in
      order before performing its configured behavior, expose the total call
      count, and allow its history to be reset without changing its behavior.
    functionality:
      - generate.call_history
      - generate.history_reset
    required_test_types:
      - invariant

  - id: PS-TEST-010
    title: Optional constrained signature
    status: active
    introduced: 0.1.0
    statement: >-
      generate shall optionally build a signature from an ordered parameter
      name list or inspect a supplied callable, reject invalid calls before
      recording them, and record the parameter-bound form of valid calls.
    functionality:
      - generate.explicit_signature
      - generate.callable_signature
    required_test_types:
      - positive

  - id: PS-TEST-011
    title: Unambiguous generator configuration
    status: active
    introduced: 0.1.0
    statement: >-
      generate shall require exactly one of returns, raises, or yields and
      shall reject simultaneous parameters and signature_from sources.
    functionality:
      - generate.configuration_validation
      - generate.signature_validation
    required_test_types:
      - negative

  - id: PS-TEST-012
    title: Immutable call history without reset
    status: active
    introduced: 0.1.0
    statement: >-
      Every generated function shall record immutable invocation metadata in
      order before performing its configured behavior and expose its total call
      count. A newly generated function shall begin with empty history.
    functionality:
      - generate.call_history
    required_test_types:
      - positive
      - negative

  - id: PS-TEST-013
    title: Generated return behavior as a stub
    status: active
    introduced: 0.1.0
    statement: >-
      generate(returns=value) shall return a Stub that accepts arbitrary
      positional and keyword arguments and returns the configured value on
      every call.
    functionality:
      - generate.return_behavior
    required_test_types:
      - positive
