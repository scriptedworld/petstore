[project]
name = "petstore"
version = "0.2.0"
description = "Small, reusable tools for personal Python development."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "J W" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petstore"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "commitizen>=4.18.0",
    "complexipy>=4.0.2",
    "coverage>=7.10",
    "interrogate>=1.7.0",
    "mypy>=1.17.1",
    "pre-commit>=4.6.2",
    "pylint>=3.3.8",
    "pytest>=8.4.1",
    "ruff>=0.12.10",
    "rust-just==1.58.0",
    "vulture>=2.14",
    # toolbox's adapters import wrench and yaml from the python3 on PATH, which
    # under `uv run just checks` is this environment's. wrench needs 3.12.
    "pyyaml>=6",
    "wrench; python_version >= '3.12'",
]

[tool.uv.sources]
wrench = { git = "https://github.com/scriptedworld/wrench", subdirectory = "python", rev = "be2e4de16ad4" }

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
update_changelog_on_bump = true
allowed_prefixes = []

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]

# The gate's python-std-quality jig runs the suite under coverage and judges
# each file at 80% of lines and branches; no threshold is set here.
[tool.coverage.run]
branch = true
source = ["petstore"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter.
    "CPY001", # The project carries a repository-level LICENSE.
    "D203",   # Conflicts with D211.
    "D213",   # Conflicts with D212.
    "TRY003", # Dynamic ValueError text belongs at the validation site.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pylint.main]
py-version = "3.12"
recursive = true
ignore-paths = ['^\.venv/']

[tool.pylint."messages control"]
disable = [
    "missing-function-docstring",
    "too-few-public-methods",
]

[tool.pylint.format]
max-line-length = 150

[tool.pylint.reports]
score = false

[tool.interrogate]
exclude = ["tests"]
ignore-init-method = true
ignore-module = false
ignore-nested-functions = true
# Ruff D418 forbids docstrings on @overload stubs; the implementation carries
# the documentation. Without this the two configured tools contradict.
ignore-overloaded-functions = true
ignore-private = true
ignore-property-decorators = true
verbose = 1

[tool.vulture]
exclude = [".venv/"]
paths = ["src", "tests"]
sort_by_size = true
