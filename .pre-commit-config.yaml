minimum_pre_commit_version: "4.0.0"
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: quality
        name: project quality gates
        entry: uv run poe quality
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: commitizen
        name: conventional commit message
        entry: uv run poe commit-check --commit-msg-file
        language: system
        stages: [commit-msg]
